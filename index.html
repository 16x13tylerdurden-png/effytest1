<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>effy404 - Links</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;700&display=swap');

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: #1a1a1a;
      font-family: 'Quicksand', sans-serif;
      background-color: #fff3f7;
      background-image:
        linear-gradient(#ffd9df 1px, transparent 1px),
        linear-gradient(90deg, #ffd9df 1px, transparent 1px);
      background-size: 30px 30px;
      overflow-x: hidden;
    }

    .kdisplay { font-family: 'Fredoka One', cursive; }

    .page {
      width: min(100%, 900px);
      margin: 0 auto;
      padding: 24px 18px 44px;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-top: 10px;
    }

    .avatar-wrap {
      position: relative;
      width: 168px;
      height: 168px;
      margin-bottom: 24px;
    }

    .avatar-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      border: 5px solid #1a1a1a;
      box-shadow: 7px 7px 0 #1a1a1a, 0 0 0 6px #ffb6c1, 0 0 0 10px #1a1a1a;
      background: #ffb6c1;
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .vip-badge {
      position: absolute;
      right: -10px;
      bottom: 4px;
      background: #ffd6ad;
      border: 3px solid #1a1a1a;
      box-shadow: 3px 3px 0 #1a1a1a;
      border-radius: 9px;
      padding: 5px 12px;
      transform: rotate(14deg);
      font-family: 'Fredoka One', cursive;
      font-size: 14px;
      z-index: 2;
    }

    .hero-name {
      margin: 0 0 14px;
      font-family: 'Fredoka One', cursive;
      font-size: clamp(4rem, 10vw, 6.8rem);
      line-height: .95;
      letter-spacing: -2px;
      text-shadow: 4px 4px 0 #ffb6c1, 7px 7px 0 rgba(177, 156, 217, .42);
    }

    .welcome {
      display: inline-block;
      background: #fff;
      border: 4px solid #1a1a1a;
      box-shadow: 7px 7px 0 #1a1a1a;
      border-radius: 999px;
      padding: 10px 30px;
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      font-weight: 700;
    }

    .divider {
      height: 4px;
      width: min(390px, 70vw);
      margin: 74px auto 48px;
      border-radius: 99px;
      background: #1a1a1a;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .btn-k {
      text-decoration: none;
      color: #1a1a1a;
      border: 4px solid #1a1a1a;
      box-shadow: 7px 7px 0 #1a1a1a;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .btn-k:hover {
      transform: translateY(-4px);
      box-shadow: 0 11px 0 #1a1a1a;
    }

    .btn-k:active {
      transform: translateY(5px);
      box-shadow: 0 2px 0 #1a1a1a;
    }

    .telegram {
      min-height: 190px;
      border-radius: 22px;
      background: #25232a;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 24px 34px;
    }

    .telegram .star {
      font-size: clamp(2.4rem, 6vw, 4rem);
      filter: drop-shadow(0 4px 0 rgba(0,0,0,.25));
    }

    .telegram .star:first-child { justify-self: start; }
    .telegram .star:last-child { justify-self: end; }

    .telegram-copy {
      text-align: center;
      min-width: 0;
    }

    .telegram-title {
      display: block;
      font-family: 'Fredoka One', cursive;
      color: #ff87d7;
      font-size: clamp(2.1rem, 7vw, 4.1rem);
      letter-spacing: 2px;
      line-height: .95;
    }

    .telegram-vip {
      display: block;
      margin-top: 4px;
      font-family: 'Fredoka One', cursive;
      color: #b69cff;
      font-size: clamp(2rem, 6vw, 3.6rem);
      line-height: 1;
    }

    .telegram-sub {
      display: block;
      margin-top: 14px;
      color: #c2a5ff;
      font-weight: 700;
      font-size: clamp(.9rem, 2.2vw, 1.05rem);
    }

    .social {
      min-height: 90px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 24px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: clamp(1.15rem, 3vw, 1.35rem);
    }

    .exclusive { background: #ffb6c1; }
    .instagram { background: #dec2df; }
    .threads { background: #ffd7ae; }
    .facebook { background: #fff; }

    footer {
      text-align: center;
      padding: 44px 0 8px;
    }

    .footer-pill {
      display: inline-block;
      background: #fff;
      border: 3px solid #1a1a1a;
      box-shadow: 5px 5px 0 #1a1a1a;
      border-radius: 999px;
      padding: 10px 30px;
      font-family: 'Fredoka One', cursive;
      font-size: 15px;
      letter-spacing: 2px;
      opacity: .65;
    }

    .footer-note {
      margin: 18px 0 0;
      font-weight: 700;
      font-size: 12px;
      opacity: .35;
    }

    @media (max-width: 640px) {
      .page { padding-left: 14px; padding-right: 14px; }
      .avatar-wrap { width: 142px; height: 142px; }
      .divider { margin-top: 58px; margin-bottom: 38px; }
      .telegram {
        min-height: 155px;
        grid-template-columns: 52px 1fr 52px;
        padding: 20px 12px;
      }
      .social { min-height: 76px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="avatar-wrap">
        <div class="avatar-ring">
          <img src="./avatar2.jpeg" alt="effy.404">
        </div>
        <div class="vip-badge">VIP 🎀</div>
      </div>

      <h1 class="hero-name">effy.404</h1>
      <div class="welcome">Welcome to my world 💜✨</div>
    </section>

    <div class="divider"></div>

    <section class="links">
      <a href="https://telegram.me/+ujR9YWVJ5-k2MTBi" class="btn-k telegram">
        <span class="star">⭐</span>
        <span class="telegram-copy">
          <span class="telegram-title">TELEGRAM</span>
          <span class="telegram-vip">VIP</span>
          <span class="telegram-sub">Unlock all content • Join now</span>
        </span>
        <span class="star">⭐</span>
      </a>

      <a href="https://www.stacked.com/@effy_404/membership" class="btn-k social exclusive">Exclusive 😈 👑</a>

      <a href="https://www.instagram.com/effy.404" class="btn-k social instagram">Instagram 🧸💕</a>
      <a href="https://www.threads.com/@effy.404" class="btn-k social threads">Threads ✨🪄</a>
      <a href="https://www.facebook.com/profile.php?id=61577670664006" class="btn-k social facebook">Facebook 💬💌</a>
    </section>

    <footer>
      <div class="footer-pill">🎀 2026 effy 🎀</div>
      <p class="footer-note">Made with purple hearts &amp; kawaii magic</p>
    </footer>
  </main>
</body>
</html>
